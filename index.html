                    <input class="input w-20" data-setting="lateTime" value="${esc(state.settings.lateTime)}" />
                  </label>
                  <div class="field">
                    <span>Profil</span>
                    <div style="display:flex;gap:4px;">
                      <button class="btn ${state.settings.profile === "gece" ? "btn-sky" : ""}" data-action="profile" data-profile="gece">🌙 Gece</button>
                      <button class="btn ${state.settings.profile === "oglen" ? "btn-sky" : ""}" data-action="profile" data-profile="oglen">☀️ Öğlen</button>
                      <button class="btn ${state.settings.profile === "sabah" ? "btn-sky" : ""}" data-action="profile" data-profile="sabah">🌅 Sabah</button>
                    </div>
                  </div>
                  <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#475569;padding-bottom:8px;cursor:pointer;">
                    <input type="checkbox" data-setting="saturdayLateEnabled" ${state.settings.saturdayLateEnabled ? "checked" : ""} ${state.settings.profile === "sabah" ? "disabled" : ""} />
                    ${state.settings.profile === "gece" ? "Cmt Erken" : state.settings.profile === "oglen" ? "Cmt Geç" : "-"}
                  </label>
                  <div class="field">
                    <span>Başlangıç</span>
                    <div style="display:flex;gap:4px;">
                      <button class="btn ${state.settings.startShift === "early" ? "btn-sky" : ""}" data-action="start-shift" data-val="early">Erken Başla</button>
                      <button class="btn ${state.settings.startShift === "late" ? "btn-sky" : ""}" data-action="start-shift" data-val="late">Geç Başla</button>
                    </div>
                  </div>
                  <label class="field">
                    <span>Günlük Üretilecek Gün</span>
                    <select class="select w-44" data-setting="selectedDay">
                      ${days.map((d) => `<option value="${d.index}" ${state.selectedDay === d.index ? "selected" : ""}>${esc(d.label)} ${esc(d.fullDate)}</option>`).join("")}
                    </select>
                  </label>
                </div>

                <!-- TEKLİ + TOPLU PERSONEL EKLEME -->
                <div class="add-person-row">
                  <input id="nameInput" class="input" placeholder="Personel adı ekle..." value="${esc(nameInputVal)}" />
                  <button class="btn btn-sky" data-action="add-person">+ Ekle</button>
                  <button class="btn ${showBulkAdd ? "btn-indigo-soft" : ""}" data-action="toggle-bulk">📋 Toplu Yapıştır</button>
                </div>

                ${showBulkAdd ? `
                  <div class="bulk-box">
                    <div style="font-size:11px;font-weight:700;color:#475569;margin-bottom:6px;">
                      Toplu Personel Ekle (Her satıra bir isim veya virgülle ayrılmış liste yapıştırın)
                    </div>
                    <textarea id="bulkInput" class="bulk-textarea" placeholder="Örnek:&#10;AHMET YILMAZ&#10;MEHMET DEMİR&#10;ALİ KAYA">${esc(bulkInputVal)}</textarea>
                    <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:8px;">
                      <button class="btn" data-action="toggle-bulk">Vazgeç</button>
                      <button class="btn btn-sky" data-action="add-bulk-persons">✓ Listeyi Ekle</button>
                    </div>
                  </div>
                ` : ""}

                <div class="settings-actions">
                  <button class="btn btn-grad" data-action="gen-week">✨ Haftayı Üret</button>
                  <button class="btn btn-sky-soft" data-action="gen-day">⚡ Seçili Günü Üret</button>
                  <button class="btn btn-rose-soft" data-action="clear-all">🗑 Temizle</button>
                </div>

                <div class="settings-section">
                  <div style="font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:6px;">Mod Seçimi</div>
                  <div style="display:flex;flex-wrap:wrap;gap:6px;">
                    <button class="btn ${state.swapMode ? "btn-mode-active" : ""}" data-action="mode" data-mode="swap">↔ Takas Modu</button>
                    <button class="btn ${state.replaceMode ? "btn-mode-active" : ""}" data-action="mode" data-mode="replace">✓ Yerine Modu</button>
                    <button class="btn ${state.multiSelect ? "btn-mode-active" : ""}" data-action="mode" data-mode="multi">● Çoklu Seçim</button>
                  </div>
                </div>

                <div class="settings-meta">
                  <span><strong>${state.personnel.length}</strong> personel</span>
                  <span>•</span>
                  <span>Sıradaki: <strong>${esc(state.personnel[state.pointer] || "-")}</strong></span>
                  <span>•</span>
                  <span>Seçili: <strong>${state.selectedCells.length}</strong> hücre</span>
                  <span>•</span>
                  <span>İpucu: Hücreye <strong>sağ tıklayarak</strong> hızlı düzenleme menüsünü açabilirsiniz.</span>
                </div>
              </div>
            ` : ""}

            ${isCardLayout ? renderCardViewHtml() : renderTableHtml(false)}

            ${!boardMode && state.selectedCells.length > 0 ? `
              <div class="card card-pad mt-3 no-print">
                <div class="sel-bar">
                  <span style="color:#64748b;font-weight:600;">${state.selectedCells.length} hücre seçili:</span>
                  <button class="btn" style="background:#d4e6f9;color:#1a4b8c;" data-action="set-type" data-type="early">Erken</button>
                  <button class="btn" style="background:#f7d7d4;color:#a83029;" data-action="set-type" data-type="late">Geç</button>
                  <button class="btn" style="background:#fef3c7;color:#92400e;" data-action="set-type" data-type="sale">Satış</button>
                  <button class="btn" style="background:#e2e8f0;color:#475569;" data-action="set-type" data-type="off">Muaf</button>
                  <button class="btn" style="background:#e0f2fe;color:#0369a1;" data-action="set-type" data-type="vacation">İzin</button>
                  <button class="btn" style="background:#ffe4e6;color:#be123c;" data-action="set-type" data-type="sick">Rapor</button>
                  <button class="btn" data-action="set-type" data-type="">Temizle</button>
                  <button class="btn" data-action="edit-cell" ${state.selectedCells.length !== 1 ? "disabled" : ""}>Düzenle</button>
                  <button class="btn" data-action="toggle-complete">Çiz</button>
                  <button class="btn" style="margin-left:auto;" data-action="clear-sel">İptal</button>
                </div>
              </div>
            ` : ""}

            <!-- RENKLİ & DİKKAT ÇEKİCİ TAKAS AÇIKLAMALARI -->
            ${(!boardMode || state.changeLogs.length > 0) ? `
              <div class="swap-card ${state.changeLogs.length ? "has-logs" : ""} mt-3">
                <button class="swap-acc-btn" data-action="toggle-changelog">
                  <div class="swap-hdr-left">
                    <span class="swap-icon">⇄</span>
                    <span class="swap-title">Takas Açıklamaları</span>
                    ${state.changeLogs.length
                      ? `<span class="swap-count-badge">${state.changeLogs.length} değişiklik</span>`
                      : `<span class="swap-empty-badge">Kayıt yok</span>`}
                  </div>
                  <span class="swap-arrow">${showChangelog ? "▲" : "▼"}</span>
                </button>
                ${showChangelog ? `
                  <div class="swap-body">
                    ${state.changeLogs.length === 0 ? `
                      <div style="text-align:center;font-size:12px;color:#a21caf;opacity:0.7;padding:10px;">
                        Henüz takas veya yerine geçme kaydı yok.
                      </div>
                    ` : `
                      <div class="log-list">
                        ${state.changeLogs.map((l) => {
                          const isRep = l.kind === "replace" || String(l.text).includes("→");
                          return `
                            <div class="log-item ${isRep ? "is-replace" : ""} ${selectedLogIds.includes(l.id) ? "selected" : ""}" data-action="toggle-log" data-id="${esc(l.id)}">
                              <span class="log-tag ${isRep ? "tag-replace" : "tag-swap"}">${isRep ? "YERİNE" : "TAKAS"}</span>
                              <span class="log-text">${esc(l.text)}</span>
                              <span class="log-time">${new Date(l.createdAt).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" })}</span>
                            </div>
                          `;
                        }).join("")}
                      </div>
                      ${!boardMode && selectedLogIds.length ? `<button class="btn btn-rose-soft mt-3" data-action="del-logs">Seçili Açıklamaları Sil (${selectedLogIds.length})</button>` : ""}
                    `}
                  </div>
                ` : ""}
              </div>
            ` : ""}

            <!-- NOTLAR BÖLÜMÜ (Pano modunda gizli) -->
            ${!boardMode ? `
              <div class="card mt-3 no-print">
                <button class="acc-btn" data-action="toggle-notes">
                  <div class="notes-header-left">
                    <span>📝 Notlar & Hatırlatmalar</span>
                    ${openNotesCount > 0 ? `<span class="notes-badge">${openNotesCount} aktif</span>` : ""}
                  </div>
                  <span>${showNotes ? "▲" : "▼"}</span>
                </button>
                ${showNotes ? `
                  <div class="acc-body">
                    <div class="notes-input-row">
                      <textarea id="noteInput" class="notes-textarea" placeholder="Unutmaman gerekenler, değişiklikler, kaldığın yer... (Ctrl+Enter ile ekle)">${esc(noteInputVal)}</textarea>
                      <button class="btn btn-sky" style="align-self:flex-start;padding:10px 16px;" data-action="add-note">Not Ekle</button>
                    </div>
                    ${state.notes.length === 0 ? `
                      <div style="text-align:center;font-size:12px;color:#94a3b8;padding:10px;">Henüz not eklenmedi.</div>
                    ` : `
                      <div class="note-list">
                        ${state.notes.map((n) => `
                          <div class="note-item ${n.done ? "done" : ""}">
                            <input type="checkbox" class="note-chk" data-action="toggle-note" data-id="${esc(n.id)}" ${n.done ? "checked" : ""} />
                            <div style="flex:1;">
                              <div class="note-text">${esc(n.text)}</div>
                              <div class="note-meta">${new Date(n.createdAt).toLocaleString("tr-TR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</div>
                            </div>
                            <button class="mini-btn del" data-action="del-note" data-id="${esc(n.id)}" title="Sil">✕</button>
                          </div>
                        `).join("")}
                      </div>
                    `}
                  </div>
                ` : ""}
              </div>
            ` : ""}

            <!-- YEDEK PARÇA -->
            ${!isCardLayout ? (
              showSpecial
                ? renderTableHtml(true)
                : (!boardMode ? `<button class="show-special-btn mt-4 no-print" data-action="show-special">+ YEDEK PARÇA TABLOSUNU GÖSTER</button>` : "")
            ) : ""}
          </div>
        `;

        bindEvents(days, weekInfo);
      };

      const bindEvents = (days, weekInfo) => {
        const app = document.getElementById("app");

        const fileIn = document.getElementById("jsonFileInput");
        if (fileIn) {
          fileIn.onchange = async (e) => {
            const f = e.target.files?.[0];
            if (!f) return;
            try {
              const txt = await f.text();
              pushHistory();
              state = sanitizeState(JSON.parse(txt));
              focusTodayInWeek();
              showToast("JSON yedeği yüklendi.", "success");
              render();
            } catch {
              showToast("Geçersiz JSON dosyası.", "error");
            }
          };
        }

        const nameIn = document.getElementById("nameInput");
        if (nameIn) {
          nameIn.oninput = (e) => (nameInputVal = e.target.value);
          nameIn.onkeydown = (e) => {
            if (e.key === "Enter") addPersonAction();
          };
        }

        const bulkIn = document.getElementById("bulkInput");
        if (bulkIn) {
          bulkIn.oninput = (e) => (bulkInputVal = e.target.value);
        }

        const noteIn = document.getElementById("noteInput");
        if (noteIn) {
          noteIn.oninput = (e) => (noteInputVal = e.target.value);
          noteIn.onkeydown = (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === "Enter") addNoteAction();
          };
        }

        const cUrlIn = document.getElementById("cloudUrlInput");
        if (cUrlIn) cUrlIn.oninput = (e) => (cloudUrlInput = e.target.value);
        const cKeyIn = document.getElementById("cloudKeyInput");
        if (cKeyIn) cKeyIn.oninput = (e) => (cloudKeyInput = e.target.value);

        const pngChk = document.getElementById("pngIncludeSpecial");
        if (pngChk) {
          pngChk.onchange = (e) => {
            state.settings.includeSpecialInPng = e.target.checked;
            saveLocal();
          };
        }

        app.querySelectorAll("[data-setting]").forEach((el) => {
          el.onchange = (e) => {
            const key = el.dataset.setting;
            if (key === "startDate") {
              if (!e.target.value) return;
              switchToWeek(e.target.value);
              return;
            } else if (key === "pointer") {
              state.pointer = Number(e.target.value) || 0;
            } else if (key === "selectedDay") {
              state.selectedDay = Number(e.target.value) || 0;
            } else if (key === "dayCount") {
              state.settings.dayCount = clamp(Number(e.target.value) || 1, 1, 31);
            } else if (key === "earlyPerDay" || key === "latePerDay") {
              state.settings[key] = Math.max(0, Number(e.target.value) || 0);
            } else if (key === "saturdayLateEnabled") {
              state.settings.saturdayLateEnabled = e.target.checked;
            } else {
              state.settings[key] = e.target.value;
            }
            render();
          };
        });

        app.querySelectorAll('[data-action="cell-click"]').forEach((btn) => {
          btn.oncontextmenu = (e) => {
            if (boardMode) return;
            const sel = {
              dayIndex: Number(btn.dataset.day),
              name: btn.dataset.name,
              special: btn.dataset.special === "1",
            };
            openContextMenu(e, sel, btn.dataset.dayLabel || "");
          };
          btn.ondragstart = (e) => {
            if (boardMode) { e.preventDefault(); return; }
            const isSp = btn.dataset.special === "1";
            if (isSp) { e.preventDefault(); return; }
            draggedCell = { dayIndex: Number(btn.dataset.day), name: btn.dataset.name, special: false };
          };
          btn.ondragover = (e) => { e.preventDefault(); };
          btn.ondrop = (e) => {
            e.preventDefault();
            if (!draggedCell || boardMode) return;
            const tDay = Number(btn.dataset.day);
            const tName = btn.dataset.name;
            const tSp = btn.dataset.special === "1";
            if (draggedCell.special || tSp) { draggedCell = null; return; }
            pushHistory();
            const src = state.schedule[draggedCell.dayIndex]?.[draggedCell.name] || emptyCell();
            if (state.replaceMode) {
              if (draggedCell.dayIndex === tDay && isWorking(src.type)) {
                state.schedule[tDay] = state.schedule[tDay] || {};
                state.schedule[tDay][tName] = { ...src };
                state.schedule[tDay][draggedCell.name] = createCell("sale", saleTextFromName(tName));
                addLog(`${draggedCell.name} → ${tName} yerine`, draggedCell.dayIndex, days, "replace");
              }
            } else {
              const tgt = state.schedule[tDay]?.[tName] || emptyCell();
              state.schedule[draggedCell.dayIndex] = state.schedule[draggedCell.dayIndex] || {};
              state.schedule[tDay] = state.schedule[tDay] || {};
              state.schedule[draggedCell.dayIndex][draggedCell.name] = tgt;
              state.schedule[tDay][tName] = src;
              addLog(`${draggedCell.name} ↔ ${tName} takas`, draggedCell.dayIndex, days, "swap");
            }
            draggedCell = null;
            render();
          };
        });

        app.onclick = (e) => {
          hideContextMenu();
          const target = e.target.closest("[data-action]");
          if (!target || target.tagName === "INPUT") return;
          const act = target.dataset.action;

          if (act === "tab") { viewMode = target.dataset.tab; render(true); }
          else if (act === "layout") {
            const nextLayout = target.dataset.layout === "cards" ? "cards" : "table";
            state.settings.layoutMode = nextLayout;
            if (nextLayout === "cards") focusTodayInWeek();
            render();
          }
          else if (act === "toggle-cloud-panel") { showCloudPanel = !showCloudPanel; render(true); }
          else if (act === "save-cloud-cfg") {
            const url = cloudUrlInput.trim().replace(/\/+$/, "");
            const key = cloudKeyInput.trim();
            if (!url.startsWith("http") || key.length < 20) {
              showToast("Geçerli bir Supabase URL ve Anon Key girin.", "error");
              return;
            }
            cloudCfg = { url, key, source: "local" };
            try { localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify({ url, key })); } catch {}
            hasHydratedCloud = false;
            showToast("Buluta bağlanılıyor...", "info");
            void startCloudEngine();
            render(true);
          }
          else if (act === "clear-cloud-cfg") {
            try { localStorage.removeItem(CLOUD_CFG_KEY); } catch {}
            cloudCfg = { url: "", key: "", source: "none" };
            cloudUrlInput = "";
            cloudKeyInput = "";
            initSupabaseClient();
            showToast("Bulut bağlantısı kaldırıldı.", "info");
            render(true);
          }
          else if (act === "cloud-pull") {
            void fetchCloudState(true).then(() => showToast("Buluttan güncel veri çekildi.", "success"));
          }
          else if (act === "cloud-push") {
            pendingCloudDirty = true;
            void pushStateToCloud(false).then((ok) =>
              showToast(ok ? "Buluta kaydedildi." : "Bulut kaydı başarısız.", ok ? "success" : "error")
            );
          }
          else if (act === "toggle-board") {
            boardMode = !boardMode;
            if (boardMode) {
              showSettings = false;
              showCloudPanel = false;
              showArchive = false;
              showExportMenu = false;
              state.selectedCells = [];
              if (state.changeLogs.length > 0) showChangelog = true;
            }
            render(true);
          }
          else if (act === "prev-week") { switchToWeek(shiftDaysYmd(state.settings.startDate, -7)); }
          else if (act === "next-week") { switchToWeek(shiftDaysYmd(state.settings.startDate, 7)); }
          else if (act === "go-today-week") { switchToWeek(toYmd(mondayOf(new Date()))); }
          else if (act === "toggle-archive") { showArchive = !showArchive; render(true); }
          else if (act === "open-archive-week") { switchToWeek(target.dataset.ymd); }
          else if (act === "del-archive-week") {
            const k = target.dataset.ymd;
            if (k && state.weeksArchive?.[k] && k !== state.settings.startDate) {
              delete state.weeksArchive[k];
              showToast("Hafta arşivden silindi.", "info");
              render();
            }
          }
          else if (act === "select-mobile-day") {
            state.selectedDay = Number(target.dataset.day) || 0;
            render(true);
          }
          else if (act === "toggle-settings") { showSettings = !showSettings; render(true); }
          else if (act === "toggle-bulk") { showBulkAdd = !showBulkAdd; render(true); }
          else if (act === "add-bulk-persons") { addBulkPersonsAction(); }
          else if (act === "toggle-changelog") { showChangelog = !showChangelog; render(true); }
          else if (act === "toggle-notes") { showNotes = !showNotes; render(true); }
          else if (act === "hide-special") { showSpecial = false; render(true); }
          else if (act === "show-special") { showSpecial = true; render(true); }
          else if (act === "toggle-png-menu") { showExportMenu = !showExportMenu; render(true); }
          else if (act === "print") { window.print(); }
          else if (act === "manual-save") {
            saveLocal(true);
            if (cloudCfg.url && cloudCfg.key) {
              pendingCloudDirty = true;
              void pushStateToCloud(false).then((ok) =>
                showToast(ok ? "Yerel ve buluta kaydedildi." : "Yerel kaydedildi (bulut hatası).", ok ? "success" : "error")
              );
            } else {
              showToast("Yerel olarak kaydedildi.", "success");
            }
          }
          else if (act === "download-json") {
            snapshotCurrentWeek();
            const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `mesai-${state.settings.startDate}.json`;
            a.click();
            showToast("JSON yedeği indirildi.", "success");
          }
          else if (act === "import-json-btn") { document.getElementById("jsonFileInput")?.click(); }
          else if (act === "png") {
            const scale = Number(target.dataset.scale) || 2;
            showExportMenu = false;
            render(true);
            exportPng(scale, state.settings.includeSpecialInPng);
          }
          else if (act === "whatsapp") {
            const txt = formatAllTeamMessage(days, weekInfo);
            window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, "_blank");
          }
          else if (act === "undo") {
            if (!history.length) return;
            future.unshift(clone(state));
            state = history.pop();
            render();
          }
          else if (act === "redo") {
            if (!future.length) return;
            history.push(clone(state));
            state = future.shift();
            render();
          }
          else if (act === "profile") {
            pushHistory();
            state.settings = getProfileSettings(target.dataset.profile, state.settings);
            render();
          }
          else if (act === "start-shift") {
            state.settings.startShift = target.dataset.val;
            render();
          }
          else if (act === "add-person") { addPersonAction(); }
          else if (act === "move-up" || act === "move-down") {
            const i = Number(target.dataset.idx);
            const t = i + (act === "move-up" ? -1 : 1);
            if (t >= 0 && t < state.personnel.length) {
              pushHistory();
              [state.personnel[i], state.personnel[t]] = [state.personnel[t], state.personnel[i]];
              render();
            }
          }
          else if (act === "del-person") {
            const i = Number(target.dataset.idx);
            pushHistory();
            const name = state.personnel[i];
            state.personnel.splice(i, 1);
            Object.keys(state.schedule).forEach((k) => delete state.schedule[k]?.[name]);
            Object.keys(state.offMap).forEach((k) => delete state.offMap[k]?.[name]);
            state.pointer = state.personnel.length ? state.pointer % state.personnel.length : 0;
            render();
          }
          else if (act === "gen-week") {
            if (!state.personnel.length) { showToast("Önce personel ekleyin.", "error"); return; }
            pushHistory();
            let ptr = state.pointer;
            const ns = {};
            days.forEach((d) => {
              const r = generateSmartDay(d, ptr);
              ns[d.index] = r.cells;
              ptr = r.nextPointer;
            });
            state.schedule = ns;
            state.pointer = ptr;
            state.special = {};
            state.reveal = days.map(() => 0);
            state.draw = days.map(() => 0);
            state.selectedCells = [];
            showToast("Haftalık plan oluşturuldu.", "success");
            render();
          }
          else if (act === "gen-day") {
            const d = days.find((x) => x.index === state.selectedDay);
            if (!d || !state.personnel.length) { showToast("Önce personel ekleyin.", "error"); return; }
            pushHistory();
            const r = generateSmartDay(d, state.pointer);
            state.schedule[d.index] = r.cells;
            state.pointer = r.nextPointer;
            state.selectedCells = [];
            showToast(`${d.label} oluşturuldu.`, "success");
            render();
          }
          else if (act === "clear-all") {
            pushHistory();
            state.schedule = {};
            state.special = {};
            state.changeLogs = [];
            state.reveal = days.map(() => 0);
            state.draw = days.map(() => 0);
            state.selectedCells = [];
            showToast("Tablo temizlendi.", "info");
            render();
          }
          else if (act === "mode") {
            const m = target.dataset.mode;
            state.swapMode = m === "swap" ? !state.swapMode : false;
            state.replaceMode = m === "replace" ? !state.replaceMode : false;
            state.multiSelect = m === "multi" ? !state.multiSelect : false;
            state.selectedCells = [];
            render(true);
          }
          else if (act === "day-header") {
            if (boardMode) return;
            viewMode = "daily";
            state.selectedDay = Number(target.dataset.day);
            render(true);
          }
          else if (act === "cell-click") {
            if (boardMode) return;
            const sel = { dayIndex: Number(target.dataset.day), name: target.dataset.name, special: target.dataset.special === "1" };
            if (state.swapMode || state.replaceMode) {
              const ex = state.selectedCells.find((s) => s.dayIndex === sel.dayIndex && s.name === sel.name && !!s.special === !!sel.special);
              const next = ex ? state.selectedCells : [...state.selectedCells, sel];
              if (state.swapMode && next.length === 2) {
                const [a, b] = next;
                if (a.special || b.special) { state.selectedCells = [sel]; render(true); return; }
                pushHistory();
                const ac = state.schedule[a.dayIndex]?.[a.name] || emptyCell();
                const bc = state.schedule[b.dayIndex]?.[b.name] || emptyCell();
                state.schedule[a.dayIndex] = state.schedule[a.dayIndex] || {};
                state.schedule[b.dayIndex] = state.schedule[b.dayIndex] || {};
                state.schedule[a.dayIndex][a.name] = bc;
                state.schedule[b.dayIndex][b.name] = ac;
                state.selectedCells = [];
                addLog(`${a.name} ↔ ${b.name} takas`, a.dayIndex, days, "swap");
                render(); return;
              }
              if (state.replaceMode && next.length === 2) {
                const [a, b] = next;
                if (a.special || b.special || a.dayIndex !== b.dayIndex) { state.selectedCells = [sel]; render(true); return; }
                pushHistory();
                const ac = state.schedule[a.dayIndex]?.[a.name] || emptyCell();
                if (isWorking(ac.type)) {
                  state.schedule[a.dayIndex] = state.schedule[a.dayIndex] || {};
                  state.schedule[a.dayIndex][b.name] = { ...ac };
                  state.schedule[a.dayIndex][a.name] = createCell("sale", saleTextFromName(b.name));
                  addLog(`${a.name} → ${b.name} yerine`, a.dayIndex, days, "replace");
                }
                state.selectedCells = [];
                render(); return;
              }
              state.selectedCells = next;
              render(true); return;
            }
            if (sel.special && !state.multiSelect) {
              const cur = state.special[sel.dayIndex] || emptyCell();
              let next;
              if (state.settings.profile === "sabah") next = cur.type === "" ? shiftCell("late", state.settings) : emptyCell();
              else next = cur.type === "" ? shiftCell("early", state.settings) : cur.type === "early" ? shiftCell("late", state.settings) : emptyCell();
              pushHistory();
              state.special[sel.dayIndex] = next;
              render(); return;
            }
            const ex = state.selectedCells.some((s) => s.dayIndex === sel.dayIndex && s.name === sel.name && !!s.special === !!sel.special);
            if (state.multiSelect) {
              state.selectedCells = ex
                ? state.selectedCells.filter((s) => !(s.dayIndex === sel.dayIndex && s.name === sel.name && !!s.special === !!sel.special))
                : [...state.selectedCells, sel];
            } else {
              state.selectedCells = ex ? [] : [sel];
            }
            render(true);
          }
          else if (act === "set-type") {
            applyTypeToCells(state.selectedCells, target.dataset.type);
          }
          else if (act === "edit-cell") {
            if (state.selectedCells.length === 1) editSingleCell(state.selectedCells[0]);
          }
          else if (act === "toggle-complete") {
            toggleCompleteCells(state.selectedCells);
          }
          else if (act === "clear-sel") { state.selectedCells = []; render(true); }
          else if (act === "toggle-log") {
            if (boardMode) return;
            const id = target.dataset.id;
            selectedLogIds = selectedLogIds.includes(id) ? selectedLogIds.filter((x) => x !== id) : [...selectedLogIds, id];
            render(true);
          }
          else if (act === "del-logs") {
            state.changeLogs = state.changeLogs.filter((c) => !selectedLogIds.includes(c.id));
            selectedLogIds = [];
            render();
          }
          else if (act === "add-note") { addNoteAction(); }
          else if (act === "del-note") {
            const id = target.dataset.id;
            state.notes = state.notes.filter((n) => n.id !== id);
            render();
          }
          else if (act === "reveal-next") {
            pushHistory();
            const r = days.map((_, i) => state.reveal[i] ?? 0);
            const idx = r.findIndex((v) => v < 2);
            if (idx !== -1) { r[idx]++; state.reveal = r; state.selectedDay = idx; render(); }
          }
          else if (act === "reveal-prev") {
            pushHistory();
            const r = days.map((_, i) => state.reveal[i] ?? 0);
            let idx = -1;
            for (let i = r.length - 1; i >= 0; i--) if (r[i] > 0) { idx = i; break; }
            if (idx !== -1) { r[idx]--; state.reveal = r; state.selectedDay = idx; render(); }
          }
          else if (act === "reveal-reset") {
            pushHistory();
            state.reveal = days.map(() => 0);
            state.draw = days.map(() => 0);
            render();
          }
          else if (act === "draw-next" || act === "draw-prev") {
            pushHistory();
            const dr = days.map((_, i) => state.draw[i] ?? 0);
            const first = state.settings.startShift === "late" ? "late" : "early";
            const second = first === "late" ? "early" : "late";
            const setComp = (di, type, val) => {
              Object.keys(state.schedule[di] || {}).forEach((n) => {
                const c = state.schedule[di][n];
                if (c?.type === type || (type === "early" && c?.type === "sale")) state.schedule[di][n] = { ...c, completed: val };
              });
              if (state.special[di]?.type === type) state.special[di] = { ...state.special[di], completed: val };
            };
            if (act === "draw-next") {
              const idx = dr.findIndex((v) => v < 2);
              if (idx !== -1) {
                if (dr[idx] === 0) { setComp(idx, first, true); dr[idx] = 1; }
                else { setComp(idx, second, true); dr[idx] = 2; }
                state.draw = dr; state.selectedDay = idx; render();
              }
            } else {
              let idx = -1;
              for (let i = dr.length - 1; i >= 0; i--) if (dr[i] > 0) { idx = i; break; }
              if (idx !== -1) {
                if (dr[idx] === 2) { setComp(idx, second, false); dr[idx] = 1; }
                else { setComp(idx, first, false); dr[idx] = 0; }
                state.draw = dr; state.selectedDay = idx; render();
              }
            }
          }
        };

        app.querySelectorAll('[data-action="toggle-note"]').forEach((chk) => {
          chk.onchange = () => {
            const id = chk.dataset.id;
            state.notes = state.notes.map((n) => (n.id === id ? { ...n, done: chk.checked } : n));
            render();
          };
        });
      };

      const addPersonAction = () => {
        const v = nameInputVal.trim().toLocaleUpperCase("tr-TR");
        if (!v || state.personnel.includes(v)) return;
        pushHistory();
        state.personnel.push(v);
        nameInputVal = "";
        render();
      };

      const addBulkPersonsAction = () => {
        const parts = bulkInputVal
          .split(/[\r\n,;\t]+/)
          .map((x) => x.trim().toLocaleUpperCase("tr-TR"))
          .filter((x) => x.length > 0);
        const uniqueNew = [];
        parts.forEach((name) => {
          if (!state.personnel.includes(name) && !uniqueNew.includes(name)) {
            uniqueNew.push(name);
          }
        });
        if (!uniqueNew.length) {
          showToast("Eklenecek yeni personel bulunamadı.", "error");
          return;
        }
        pushHistory();
        state.personnel.push(...uniqueNew);
        bulkInputVal = "";
        showBulkAdd = false;
        showToast(`${uniqueNew.length} personel toplu eklendi.`, "success");
        render();
      };

      const addNoteAction = () => {
        const txt = noteInputVal.trim();
        if (!txt) return;
        state.notes.unshift({
          id: `${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          text: txt,
          done: false,
          createdAt: new Date().toISOString(),
        });
        noteInputVal = "";
        showToast("Not eklendi.", "success");
        render();
      };

      // Global lifecycle & sync listeners
      document.addEventListener("click", (e) => {
        if (ctxTarget && !e.target.closest("#ctxMenu")) hideContextMenu();
      });
      window.addEventListener("scroll", hideContextMenu, true);
      window.addEventListener("resize", hideContextMenu);

      // Sayfa kapanırken / arka plana geçerken bekleyen kaydı anında buluta gönder
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          if (pendingCloudDirty) {
            if (cloudSaveTimer) clearTimeout(cloudSaveTimer);
            void pushStateToCloud(true);
          }
        } else if (document.visibilityState === "visible") {
          if (cloudCfg.url && cloudCfg.key && !pendingCloudDirty) {
            void fetchCloudState(false);
          }
        }
      });
      window.addEventListener("pagehide", () => {
        if (pendingCloudDirty) {
          if (cloudSaveTimer) clearTimeout(cloudSaveTimer);
          void pushStateToCloud(true);
        }
      });
      window.addEventListener("online", () => {
        if (cloudCfg.url && cloudCfg.key) {
          if (pendingCloudDirty) void pushStateToCloud(false);
          else void fetchCloudState(false);
        }
      });
      window.addEventListener("focus", () => {
        if (cloudCfg.url && cloudCfg.key && !pendingCloudDirty) {
          void fetchCloudState(false);
        }
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (ctxTarget) { hideContextMenu(); return; }
          if (boardMode) { boardMode = false; render(true); return; }
        }
        const tag = e.target?.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
          e.preventDefault();
          if (history.length) { future.unshift(clone(state)); state = history.pop(); render(); }
        } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") {
          e.preventDefault();
          if (future.length) { history.push(clone(state)); state = future.shift(); render(); }
        }
      });

      render(true);
      void startCloudEngine();
    })();
  </script>
</body>
</html>
