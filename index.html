<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mesai Planlayıcı Pro</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mesai Pro" />
  <!-- Supabase JS v2 (İnternet yoksa uygulama yerel/offline modda sorunsuz çalışmaya devam eder) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light;
      --bg-page: #eaedf2;
      --bg-white: #ffffff;
      --bg-header-row: #f1f3f7;
      --zebra-dark: #b8c0cc;
      --zebra-light: #ffffff;
      --border-slate: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --early-bg: #d4e6f9;
      --early-fg: #1a4b8c;
      --late-bg: #f7d7d4;
      --late-fg: #a83029;
      --sale-bg: #fef3c7;
      --sale-fg: #92400e;
      --vac-bg: #e0f2fe;
      --vac-fg: #0369a1;
      --sick-bg: #ffe4e6;
      --sick-fg: #be123c;
      --off-bg: #e2e8f0;
      --off-fg: #64748b;
      --empty-bg: #f8f9fb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg-page);
      color: var(--text-main);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-width: 320px;
      min-height: 100vh;
      line-height: 1.4;
    }

    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: transparent; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #e2e8f0; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 999px; }

    /* Header */
    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--border-slate);
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .topbar-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #0ea5e9, #4f46e5);
      display: flex; align-items: center; justify-content: center;
      color: #fff; flex-shrink: 0;
    }
    .brand-top { display: flex; align-items: center; gap: 6px; }
    .brand h1 { font-size: 14px; font-weight: 700; line-height: 1.1; color: #1e293b; }
    .brand p { font-size: 10px; color: #94a3b8; margin-top: 2px; }

    /* Cloud Status Pill */
    .cloud-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 7px; border-radius: 999px;
      font-size: 10px; font-weight: 700; transition: 0.15s;
    }
    .cloud-pill.synced { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
    .cloud-pill.saving { background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }
    .cloud-pill.loading { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
    .cloud-pill.error { background: #fff1f2; color: #e11d48; border: 1px solid #fecdd3; }
    .cloud-pill.offline { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }
    .cloud-pill:hover { filter: brightness(0.95); }

    .center-controls {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    }
    .tabs {
      display: flex; align-items: center;
      background: #f1f3f7; border-radius: 8px; padding: 2px;
    }
    .tab-btn {
      padding: 6px 14px; border-radius: 6px;
      font-size: 12px; font-weight: 600; color: #64748b; transition: 0.15s;
    }
    .tab-btn.active { background: #fff; color: #1e293b; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
    .tab-btn:hover:not(.active) { color: #334155; }

    /* Week Navigation Bar */
    .week-nav {
      display: inline-flex; align-items: center; gap: 4px;
      background: #f1f3f7; border-radius: 8px; padding: 2px;
    }
    .week-nav-btn {
      padding: 5px 9px; border-radius: 6px;
      font-size: 12px; font-weight: 600; color: #475569; transition: 0.15s;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .week-nav-btn:hover { background: #fff; color: #0f172a; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
    .week-nav-current {
      padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 700;
      color: #0369a1; background: #e0f2fe; white-space: nowrap;
    }
    .week-nav-current:hover { background: #bae6fd; }
    .archive-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
      background: #0284c7; color: #fff; font-size: 10px; font-weight: 700;
      margin-left: 4px;
    }

    /* Layout toggle (Tablo / Mobil Kart) */
    .layout-toggle {
      display: inline-flex; align-items: center;
      background: #f1f3f7; border-radius: 8px; padding: 2px;
    }
    .layout-btn {
      padding: 5px 10px; border-radius: 6px;
      font-size: 11px; font-weight: 700; color: #64748b; transition: 0.15s;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .layout-btn.active { background: #0ea5e9; color: #fff; box-shadow: 0 1px 2px rgba(14,165,233,0.3); }
    .layout-btn:hover:not(.active) { color: #334155; }

    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 10px; border-radius: 8px;
      font-size: 12px; font-weight: 600; transition: 0.15s;
      background: #f1f3f7; color: #475569;
    }
    .btn:hover:not(:disabled) { background: #e2e8f0; }
    .btn-icon { padding: 6px; }
    .btn-sky { background: #0ea5e9; color: #fff; }
    .btn-sky:hover:not(:disabled) { background: #0284c7; }
    .btn-grad { background: linear-gradient(90deg, #0ea5e9, #6366f1); color: #fff; }
    .btn-grad:hover:not(:disabled) { filter: brightness(1.08); }
    .btn-sky-soft { background: #e0f2fe; color: #0369a1; }
    .btn-sky-soft:hover:not(:disabled) { background: #bae6fd; }
    .btn-indigo-soft { background: #eef2ff; color: #4338ca; }
    .btn-indigo-soft:hover:not(:disabled) { background: #e0e7ff; }
    .btn-rose-soft { background: #fff1f2; color: #e11d48; }
    .btn-rose-soft:hover:not(:disabled) { background: #ffe4e6; }
    .btn-emerald-soft { background: #ecfdf5; color: #059669; }
    .btn-emerald-soft:hover:not(:disabled) { background: #d1fae5; }
    .btn-wa { background: rgba(37, 211, 102, 0.12); color: #16a34a; }
    .btn-wa:hover:not(:disabled) { background: rgba(37, 211, 102, 0.22); }
    .btn-mode-active { background: #fae8ff; color: #a21caf; box-shadow: 0 0 0 1px #f0abfc; }
    .btn-active-icon { background: #f0f9ff; color: #0284c7; }
    .divider { width: 1px; height: 20px; background: #e2e8f0; margin: 0 2px; }

    /* Container */
    .container { max-width: 1600px; margin: 0 auto; padding: 12px 16px 32px; }

    /* Tam Ekran Pano Modu */
    body.board-mode .container { max-width: 100%; padding: 16px 24px 36px; }
    body.board-mode table.sched { font-size: 16px; }
    body.board-mode .cell-btn { min-height: 68px; font-size: 15px; padding: 12px 10px; }
    body.board-mode .person-name { font-size: 15px; }
    body.board-mode .day-hdr-label { font-size: 16px; }
    body.board-mode .day-hdr-date { font-size: 12px; }
    body.board-mode .log-item { font-size: 14px; padding: 11px 14px; }

    .board-bar {
      background: linear-gradient(90deg, #0f172a, #1e293b);
      color: #fff;
      padding: 10px 24px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.18);
    }
    .board-bar-left { display: flex; align-items: center; gap: 12px; }
    .board-badge {
      padding: 3px 10px; border-radius: 999px;
      background: #0ea5e9; color: #fff;
      font-size: 11px; font-weight: 800; letter-spacing: 0.05em;
    }
    .board-title { font-size: 15px; font-weight: 700; }
    .board-exit-btn {
      padding: 7px 14px; border-radius: 8px;
      background: rgba(255,255,255,0.14); color: #fff;
      font-size: 12px; font-weight: 700; transition: 0.15s;
    }
    .board-exit-btn:hover { background: rgba(255,255,255,0.25); }

    /* Cards */
    .card {
      background: #fff;
      border: 1px solid var(--border-slate);
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      overflow: hidden;
    }
    .card-pad { padding: 14px 16px; }
    .mt-3 { margin-top: 12px; }
    .mt-4 { margin-top: 16px; }
    .mb-3 { margin-bottom: 12px; }

    /* Cloud Panel */
    .cloud-card {
      background: linear-gradient(135deg, #f0f9ff 0%, #ffffff 60%);
      border: 1.5px solid #bae6fd;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .cloud-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    /* Archive Drawer */
    .archive-strip {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    }
    .archive-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 700;
      background: #f1f3f7; color: #475569; border: 1px solid #e2e8f0; transition: 0.15s;
    }
    .archive-pill:hover { background: #e2e8f0; color: #0f172a; }
    .archive-pill.active { background: #0ea5e9; color: #fff; border-color: #0284c7; }
    .archive-pill-del {
      font-size: 10px; opacity: 0.65; padding: 0 2px; border-radius: 4px;
    }
    .archive-pill-del:hover { opacity: 1; background: rgba(225,29,72,0.18); color: #be123c; }

    /* Settings */
    .settings-grid {
      display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px;
    }
    .field { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #64748b; }
    .field span { font-weight: 600; }
    .input, .select {
      border: 1px solid var(--border-slate); border-radius: 8px;
      padding: 7px 10px; font-size: 13px; background: #fff; outline: none;
    }
    .input:focus, .select:focus { border-color: #38bdf8; }
    .w-20 { width: 78px; }
    .w-28 { width: 115px; }
    .w-40 { width: 165px; }
    .w-44 { width: 185px; }

    .add-person-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .add-person-row .input { flex: 1; min-width: 220px; }
    .bulk-box {
      margin-top: 10px; padding: 12px; border-radius: 10px;
      background: #f8fafc; border: 1px dashed #94a3b8;
    }
    .bulk-textarea {
      width: 100%; min-height: 92px; padding: 8px 10px;
      border: 1px solid var(--border-slate); border-radius: 8px;
      font-size: 13px; background: #fff; outline: none; resize: vertical;
    }
    .bulk-textarea:focus { border-color: #38bdf8; }

    .settings-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .settings-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid #f1f5f9; }
    .settings-meta {
      margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px;
      font-size: 12px; color: #94a3b8;
    }
    .settings-meta strong { color: #334155; }

    /* Schedule Table */
    .table-wrap { overflow-x: auto; }
    table.sched {
      width: 100%; border-collapse: collapse; min-width: 900px; font-size: 14px;
    }
    table.sched thead tr {
      background: var(--bg-header-row);
      border-bottom: 1px solid var(--border-slate);
    }
    table.sched.special-tbl thead tr { background: rgba(255, 251, 235, 0.75); }
    table.sched th {
      padding: 12px 10px; text-align: center;
      border-right: 1px solid #f1f5f9; min-width: 140px;
      position: relative;
    }
    table.sched th:last-child { border-right: none; }
    table.sched th.col-person {
      position: sticky; left: 0; z-index: 20;
      text-align: left; padding-left: 16px; min-width: 215px;
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: #64748b;
      background: var(--bg-header-row);
      border-right: 1px solid var(--border-slate);
    }
    table.sched.special-tbl th.col-person {
      background: #fffbeb; color: #b45309;
    }

    /* Bugün Vurgusu */
    table.sched th.is-today {
      background: linear-gradient(180deg, #e0f2fe 0%, #f0f9ff 100%);
      box-shadow: inset 0 3px 0 #0ea5e9;
    }
    table.sched.special-tbl th.is-today {
      background: linear-gradient(180deg, #fef3c7 0%, #fffbeb 100%);
      box-shadow: inset 0 3px 0 #f59e0b;
    }
    .today-pill {
      display: inline-block; margin-top: 3px; padding: 1px 7px; border-radius: 999px;
      background: #0ea5e9; color: #fff; font-size: 9px; font-weight: 800;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    table.sched td.shift-td.is-today-col {
      background-image: linear-gradient(rgba(14, 165, 233, 0.06), rgba(14, 165, 233, 0.06));
    }

    .day-hdr-btn { width: 100%; text-align: center; }
    .day-hdr-label { font-size: 14px; font-weight: 700; color: #334155; }
    .day-hdr-date { font-size: 11px; color: #94a3b8; margin-top: 2px; font-weight: 500; }
    th.is-today .day-hdr-label { color: #0369a1; }

    table.sched tbody tr { border-bottom: 1px solid var(--border-slate); }
    table.sched tbody tr.zebra-0 { background: var(--zebra-dark); }
    table.sched tbody tr.zebra-1 { background: var(--zebra-light); }

    table.sched td.person-cell {
      position: sticky; left: 0; z-index: 10;
      padding: 0 14px; border-right: 1px solid var(--border-slate);
    }
    tr.zebra-0 td.person-cell { background: var(--zebra-dark); }
    tr.zebra-1 td.person-cell { background: var(--zebra-light); }
    table.sched.special-tbl td.person-cell { background: #fffbeb; }

    .person-box {
      display: flex; align-items: center; gap: 8px; padding: 12px 0;
    }
    .person-name { font-size: 13px; font-weight: 700; color: #1e293b; white-space: nowrap; }
    .person-counters { display: flex; gap: 6px; margin-top: 2px; opacity: 0.85; }
    .cnt-e { font-size: 10px; font-weight: 700; color: #2563eb; }
    .cnt-g { font-size: 10px; font-weight: 700; color: #e11d48; }

    .person-actions {
      margin-left: auto; display: flex; align-items: center; gap: 2px;
      opacity: 0; transition: 0.15s;
    }
    tr:hover .person-actions { opacity: 1; }
    .mini-btn {
      padding: 4px 5px; border-radius: 5px; color: #475569;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; line-height: 1;
    }
    .mini-btn:hover:not(:disabled) { background: rgba(0,0,0,0.08); color: #0f172a; }
    .mini-btn.del:hover { background: #ffe4e6; color: #e11d48; }

    .ek-badge {
      width: 28px; height: 28px; border-radius: 999px;
      background: #fde68a; color: #92400e;
      font-size: 10px; font-weight: 800;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .ek-name { font-size: 13px; font-weight: 700; color: #78350f; }

    table.sched td.shift-td {
      padding: 6px; border-right: 1px solid var(--border-slate); vertical-align: top;
    }
    table.sched td.shift-td:last-child { border-right: none; }

    .cell-btn {
      position: relative; width: 100%; min-height: 56px;
      border-radius: 8px; padding: 10px 8px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; transition: 0.15s;
      font-size: 13px; font-weight: 700; line-height: 1.25;
      white-space: pre-line;
    }
    .cell-btn.empty { background: var(--empty-bg); color: transparent; cursor: default; }
    .cell-btn.empty-special {
      background: #fff; border: 2px dashed #fde68a; color: #fcd34d; cursor: pointer;
    }
    .cell-btn.empty-special:hover { border-color: #fbbf24; background: #fffbeb; }
    .cell-btn.t-early { background: var(--early-bg); color: var(--early-fg); }
    .cell-btn.t-late { background: var(--late-bg); color: var(--late-fg); }
    .cell-btn.t-sale { background: var(--sale-bg); color: var(--sale-fg); }
    .cell-btn.t-vacation { background: var(--vac-bg); color: var(--vac-fg); }
    .cell-btn.t-sick { background: var(--sick-bg); color: var(--sick-fg); }
    .cell-btn.t-off { background: var(--off-bg); color: var(--off-fg); font-style: italic; font-weight: 600; }
    .cell-btn.t-custom { background: #ede9fe; color: #5b21b6; }
    .cell-btn.completed {
      background: #e2e8f0 !important; color: #94a3b8 !important;
      text-decoration: line-through; opacity: 0.72;
    }
    .cell-btn.selected { box-shadow: 0 0 0 2px #e879f9, 0 0 0 4px #fff; }
    .cell-btn:not(.empty):hover { filter: brightness(0.96); }

    .empty-state {
      padding: 36px 16px; text-align: center; color: #64748b; font-size: 13px;
      background: #fff;
    }

    /* Mobil / Kart Görünümü */
    .mobile-day-pills {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .day-pill {
      flex: 0 0 auto; padding: 8px 14px; border-radius: 10px;
      background: #fff; border: 1px solid var(--border-slate);
      text-align: center; transition: 0.15s; min-width: 96px;
    }
    .day-pill:hover { border-color: #94a3b8; }
    .day-pill.is-today:not(.active) {
      border-color: #0ea5e9; background: #f0f9ff; color: #0369a1;
    }
    .day-pill.active {
      background: linear-gradient(135deg, #0ea5e9, #4f46e5);
      color: #fff; border-color: transparent;
      box-shadow: 0 3px 10px rgba(14, 165, 233, 0.28);
    }
    .day-pill-name { font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .day-pill-date { font-size: 10px; opacity: 0.78; margin-top: 1px; }
    .day-pill-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 999px;
      background: #0ea5e9;
    }
    .day-pill.active .day-pill-dot { background: #fde047; }

    .mobile-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px;
    }
    .m-group {
      background: #fff; border: 1px solid var(--border-slate); border-radius: 12px;
      overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .m-group-hdr {
      padding: 10px 14px; font-size: 12px; font-weight: 800; letter-spacing: 0.04em;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border-slate);
    }
    .m-group-hdr.early { background: var(--early-bg); color: var(--early-fg); }
    .m-group-hdr.late { background: var(--late-bg); color: var(--late-fg); }
    .m-group-hdr.other { background: var(--sale-bg); color: var(--sale-fg); }
    .m-group-hdr.off { background: #f1f3f7; color: #475569; }
    .m-group-hdr.special { background: linear-gradient(90deg, #fffbeb, #ffffff); color: #92400e; }

    .m-list { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .m-person-card {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 10px 12px; border-radius: 10px; border: 1px solid #e2e8f0;
      background: #f8fafc; transition: 0.15s;
    }
    .m-person-card.t-early { background: #eff6ff; border-color: #bfdbfe; }
    .m-person-card.t-late { background: #fef2f2; border-color: #fecaca; }
    .m-person-card.t-sale { background: #fffbeb; border-color: #fde68a; }
    .m-person-card.t-vacation { background: #f0f9ff; border-color: #bae6fd; }
    .m-person-card.t-sick { background: #fff1f2; border-color: #fecdd3; }
    .m-person-card.t-off { background: #f1f5f9; border-color: #cbd5e1; }
    .m-person-card.t-custom { background: #f5f3ff; border-color: #ddd6fe; }
    .m-person-card.completed { opacity: 0.6; text-decoration: line-through; background: #e2e8f0; }
    .m-person-card.selected { box-shadow: 0 0 0 2px #e879f9; }
    .m-person-main { flex: 1; text-align: left; }
    .m-person-name { font-size: 13px; font-weight: 700; color: #1e293b; }
    .m-person-sub { font-size: 11px; font-weight: 600; color: #64748b; margin-top: 2px; }

    /* Special Header */
    .special-hdr {
      padding: 10px 16px; border-bottom: 1px solid var(--border-slate);
      background: linear-gradient(90deg, #fffbeb, #ffffff);
      display: flex; align-items: center; justify-content: space-between;
    }
    .special-hdr-left { display: flex; align-items: center; gap: 8px; }
    .special-icon {
      width: 28px; height: 28px; border-radius: 8px; background: #fef3c7;
      display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .special-title { font-size: 12px; font-weight: 700; color: #64748b; letter-spacing: 0.05em; }

    /* Selection bar */
    .sel-bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px;
    }

    /* Accordion Base */
    .acc-btn {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; font-size: 13px; font-weight: 700; color: #334155;
      transition: 0.15s;
    }
    .acc-btn:hover { background: #f8fafc; }
    .acc-body { border-top: 1px solid var(--border-slate); padding: 12px 16px; }

    /* Renkli & Dikkat Çekici Takas Açıklamaları */
    .swap-card {
      background: #fff;
      border: 1.5px solid #e879f9;
      border-left: 5px solid #c026d3;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(192, 38, 211, 0.10);
      overflow: hidden;
    }
    .swap-card.has-logs {
      border-color: #d946ef;
      box-shadow: 0 4px 16px rgba(217, 70, 239, 0.18);
    }
    .swap-acc-btn {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(90deg, #fdf4ff 0%, #fff7ed 55%, #ffffff 100%);
      transition: 0.15s;
    }
    .swap-acc-btn:hover {
      background: linear-gradient(90deg, #fae8ff 0%, #ffedd5 55%, #ffffff 100%);
    }
    .swap-hdr-left { display: flex; align-items: center; gap: 10px; }
    .swap-icon {
      width: 30px; height: 30px; border-radius: 9px;
      background: linear-gradient(135deg, #c026d3, #f97316);
      color: #fff; font-size: 14px; font-weight: 800;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(192, 38, 211, 0.35);
    }
    .swap-title {
      font-size: 13px; font-weight: 800; letter-spacing: 0.02em;
      color: #86198f; text-transform: uppercase;
    }
    .swap-count-badge {
      font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 999px;
      background: linear-gradient(90deg, #c026d3, #ec4899);
      color: #fff; box-shadow: 0 2px 6px rgba(217, 70, 239, 0.3);
    }
    .swap-empty-badge {
      font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
      background: #f5d0fe; color: #86198f;
    }
    .swap-arrow { color: #a21caf; font-weight: 800; font-size: 12px; }
    .swap-body {
      border-top: 1px solid #f5d0fe;
      padding: 12px 16px;
      background: linear-gradient(180deg, #fefbff 0%, #ffffff 100%);
    }
    .log-list { display: flex; flex-direction: column; gap: 7px; max-height: 220px; overflow-y: auto; }
    .log-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 9px 12px; border-radius: 10px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: 0.15s;
      border: 1px solid #f5d0fe;
      border-left: 4px solid #c026d3;
      background: linear-gradient(90deg, #fdf4ff, #ffffff);
      color: #4a044e;
    }
    .log-item.is-replace {
      border-color: #fed7aa;
      border-left-color: #f97316;
      background: linear-gradient(90deg, #fff7ed, #ffffff);
      color: #7c2d12;
    }
    .log-item:hover { transform: translateX(2px); filter: brightness(0.98); }
    .log-item.selected {
      box-shadow: 0 0 0 2px #c026d3;
      background: #fae8ff !important;
    }
    .log-tag {
      font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 6px;
      letter-spacing: 0.04em; flex-shrink: 0;
    }
    .log-tag.tag-swap { background: #c026d3; color: #fff; }
    .log-tag.tag-replace { background: #f97316; color: #fff; }
    .log-text { flex: 1; }
    .log-time {
      font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px;
      background: rgba(15, 23, 42, 0.06); color: #475569; flex-shrink: 0;
    }

    /* Notes Section */
    .notes-header-left { display: flex; align-items: center; gap: 8px; }
    .notes-badge {
      font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
      background: #e0f2fe; color: #0369a1;
    }
    .notes-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .notes-textarea {
      flex: 1; border: 1px solid var(--border-slate); border-radius: 8px;
      padding: 8px 12px; font-size: 13px; resize: vertical; min-height: 44px;
      outline: none; background: #fff;
    }
    .notes-textarea:focus { border-color: #38bdf8; }
    .note-list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
    .note-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 9px 12px; border-radius: 8px; background: #f8fafc;
      border: 1px solid #e2e8f0; font-size: 13px;
    }
    .note-item.done { opacity: 0.6; background: #f1f5f9; }
    .note-item.done .note-text { text-decoration: line-through; color: #64748b; }
    .note-text { flex: 1; white-space: pre-wrap; word-break: break-word; color: #1e293b; }
    .note-meta { font-size: 10px; color: #94a3b8; white-space: nowrap; margin-top: 2px; }
    .note-chk { margin-top: 3px; width: 15px; height: 15px; accent-color: #0ea5e9; cursor: pointer; }

    /* Context Menu (Sağ Tık Hızlı Menü) */
    .ctx-menu {
      position: fixed;
      z-index: 100;
      width: 205px;
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.20);
    }
    .ctx-hdr {
      padding: 5px 8px 7px;
      margin-bottom: 4px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 11px; font-weight: 700; color: #475569;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ctx-item {
      width: 100%; display: flex; align-items: center; gap: 8px;
      padding: 7px 9px; border-radius: 7px;
      font-size: 12px; font-weight: 600; color: #334155;
      text-align: left; transition: 0.12s;
    }
    .ctx-item:hover { background: #f1f5f9; }
    .ctx-dot {
      width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0;
    }
    .ctx-sep { height: 1px; background: #f1f5f9; margin: 4px 0; }

    /* Dropdown */
    .dropdown { position: relative; }
    .dropdown-menu {
      position: absolute; right: 0; top: calc(100% + 6px); width: 215px;
      background: #fff; border: 1px solid var(--border-slate); border-radius: 12px;
      padding: 12px; box-shadow: 0 12px 24px rgba(0,0,0,0.12); z-index: 50;
    }
    .dropdown-title {
      font-size: 11px; font-weight: 700; color: #64748b;
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;
    }

    /* Toast */
    .toast {
      position: fixed; bottom: 16px; right: 16px; z-index: 80;
      padding: 10px 16px; border-radius: 10px; font-size: 12px; font-weight: 600;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12); border: 1px solid #e2e8f0;
      background: #fff; color: #1e293b;
      transition: opacity 0.2s, transform 0.2s;
    }
    .toast.success { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }
    .toast.error { background: #fff1f2; border-color: #fecdd3; color: #be123c; }
    .hidden { display: none !important; }

    .show-special-btn {
      width: 100%; padding: 14px; border-radius: 12px;
      border: 2px dashed #cbd5e1; color: #94a3b8;
      font-size: 13px; font-weight: 700; transition: 0.15s;
    }
    .show-special-btn:hover { border-color: #94a3b8; color: #475569; background: #fff; }

    @media print {
      body { background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .no-print { display: none !important; }
      .card, .swap-card { box-shadow: none !important; }
      @page { margin: 1cm; size: landscape; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ctxMenu" class="ctx-menu hidden no-print"></div>
  <div id="toast" class="toast hidden no-print"></div>

  <script>
    (() => {
      // =========================================================================
      // ☁️ BULUT (SUPABASE) AYARLARI
      // Vercel'e yüklemeden önce kendi Supabase URL ve ANON KEY bilgilerini
      // aşağıdaki iki satıra yazarsan, açtığın her cihaz/tarayıcı otomatik bağlanır.
      // Boş bırakırsan üstteki "☁️ Bulut" rozetinden tarayıcı içinden de girebilirsin.
      // =========================================================================
      const DEFAULT_SUPABASE_URL = "";
      const DEFAULT_SUPABASE_ANON_KEY = "";
      const CLOUD_TABLE_NAME = "app_state";
      const CLOUD_STATE_ID = "00000000-0000-0000-0000-000000000001";

      const STORAGE_KEY = "omer-mesai-planlayici-cloud-v1";
      const CLOUD_CFG_KEY = "omer-mesai-cloud-config-v1";
      const SPECIAL_PERSON = "EMRAH KORKMAZ";
      const WEEKDAY_NAMES = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar"];
      const WEEKDAY_SHORT = ["Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"];
      const CLIENT_ID = `cli-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

      // --- Date Helpers ---
      const pad = (n) => String(n).padStart(2, "0");
      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
      const toYmd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const getTodayYmd = () => toYmd(new Date());
      const parseYmd = (s) => {
        const [y, m, d] = String(s || "").split("-").map(Number);
        return !y || !m || !d ? new Date() : new Date(y, m - 1, d);
      };
      const mondayOf = (d) => {
        const c = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        const js = c.getDay();
        c.setDate(c.getDate() + (js === 0 ? -6 : 1 - js));
        return c;
      };
      const shiftDaysYmd = (ymd, deltaDays) => {
        const d = parseYmd(ymd);
        d.setDate(d.getDate() + deltaDays);
        return toYmd(mondayOf(d));
      };
      const fmtDate = (ymd) => {
        const d = parseYmd(ymd);
        return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
      };
      const isoWeek = (d) => {
        const c = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        const dn = c.getUTCDay() || 7;
        c.setUTCDate(c.getUTCDate() + 4 - dn);
        const ys = new Date(Date.UTC(c.getUTCFullYear(), 0, 1));
        return Math.ceil(((c.getTime() - ys.getTime()) / 86400000 + 1) / 7);
      };
      const buildDays = (startDate, count) => {
        const start = mondayOf(parseYmd(startDate));
        const n = clamp(Number(count) || 6, 1, 31);
        const todayYmd = getTodayYmd();
        const res = [];
        const cur = new Date(start);
        while (res.length < n) {
          const js = cur.getDay();
          if (js !== 0) {
            const idx = js - 1;
            const ymd = toYmd(cur);
            res.push({
              index: res.length,
              ymd,
              shortLabel: WEEKDAY_SHORT[idx],
              label: WEEKDAY_NAMES[idx],
              fullDate: fmtDate(ymd),
              isSaturday: js === 6,
              isToday: ymd === todayYmd,
            });
          }
          cur.setDate(cur.getDate() + 1);
        }
        return res;
      };
      const getWeekInfo = (days) => {
        if (!days.length) return "-";
        const f = parseYmd(days[0].ymd);
        const l = parseYmd(days[days.length - 1].ymd);
        return `${isoWeek(f)}. Hafta • ${fmtDate(toYmd(f))} → ${fmtDate(toYmd(l))}`;
      };

      // --- State Helpers ---
      const clone = (v) => JSON.parse(JSON.stringify(v));
      const emptyCell = () => ({ type: "", text: "", completed: false });
      const createCell = (type, text, ov) => ({ ...emptyCell(), type, text, ...(ov || {}) });
      const isWorking = (t) => t === "early" || t === "late" || t === "sale" || t === "custom";
      const shiftText = (kind, s) =>
        kind === "early" ? `${s.earlyLabel} ${s.earlyTime}`.trim() : `${s.lateLabel} ${s.lateTime}`.trim();
      const shiftCell = (kind, s) => createCell(kind, shiftText(kind, s));
      const saleTextFromName = (name) => `SATIŞ: ${name.trim().split(/\s+/)[0] || name}`;
      const saleTextFromManualName = () => {
        const input = window.prompt("Satış yapan kişinin adı (isteğe bağlı):\nBoş bırakırsanız sadece 'SATIŞ' yazılacak");
        if (input === null) return null;
        const name = input.trim();
        return name ? `SATIŞ: ${name.split(/\s+/)[0]}` : "SATIŞ";
      };

      const getProfileSettings = (p, cur) => {
        if (p === "sabah") {
          return { ...cur, profile: p, earlyPerDay: 0, earlyTime: "", lateTime: "20:00", startShift: "late", saturdayLateEnabled: false };
        }
        if (p === "oglen") {
          return { ...cur, profile: p, earlyTime: "12:00", lateTime: "04:00", startShift: "early", saturdayLateEnabled: false };
        }
        return { ...cur, profile: p, earlyTime: "20:00", lateTime: "12:00", startShift: "late", saturdayLateEnabled: false };
      };

      const createInitialState = () => ({
        personnel: [],
        settings: {
          startDate: toYmd(mondayOf(new Date())),
          dayCount: 6,
          earlyPerDay: 2,
          latePerDay: 3,
          earlyLabel: "ERKEN GİRİŞ",
          earlyTime: "20:00",
          lateLabel: "GEÇ ÇIKIŞ",
          lateTime: "12:00",
          profile: "gece",
          startShift: "late",
          saturdayLateEnabled: false,
          includeSpecialInPng: false,
          layoutMode: "table",
        },
        pointer: 0,
        schedule: {},
        special: {},
        offMap: {},
        changeLogs: [],
        weeksArchive: {},
        notes: [],
        reveal: [],
        draw: [],
        selectedDay: 0,
        swapMode: false,
        replaceMode: false,
        multiSelect: false,
        selectedCells: [],
        _meta: { updatedAt: 0, clientId: CLIENT_ID },
      });

      const sanitizeState = (raw) => {
        const base = createInitialState();
        if (!raw || typeof raw !== "object") return base;
        const ss = raw.settings && typeof raw.settings === "object" ? raw.settings : {};
        const mergedSettings = { ...base.settings, ...ss };
        const profile = ["gece", "oglen", "sabah"].includes(mergedSettings.profile) ? mergedSettings.profile : "gece";
        const layoutMode = mergedSettings.layoutMode === "cards" ? "cards" : "table";
        const personnel = Array.isArray(raw.personnel)
          ? raw.personnel.filter((x) => typeof x === "string" && x.trim().length > 0)
          : [];
        const dayCount = clamp(Number(mergedSettings.dayCount) || 6, 1, 31);
        return {
          ...base,
          ...raw,
          personnel,
          settings: {
            ...mergedSettings,
            profile,
            layoutMode,
            dayCount,
            earlyPerDay: Math.max(0, Number(mergedSettings.earlyPerDay) || 0),
            latePerDay: Math.max(0, Number(mergedSettings.latePerDay) || 0),
          },
          pointer: personnel.length ? clamp(Number(raw.pointer) || 0, 0, personnel.length - 1) : 0,
          schedule: raw.schedule && typeof raw.schedule === "object" ? raw.schedule : {},
          special: raw.special && typeof raw.special === "object" ? raw.special : {},
          offMap: raw.offMap && typeof raw.offMap === "object" ? raw.offMap : {},
          changeLogs: Array.isArray(raw.changeLogs) ? raw.changeLogs : [],
          weeksArchive: raw.weeksArchive && typeof raw.weeksArchive === "object" ? raw.weeksArchive : {},
          notes: Array.isArray(raw.notes) ? raw.notes : [],
          reveal: Array.isArray(raw.reveal) ? raw.reveal : [],
          draw: Array.isArray(raw.draw) ? raw.draw : [],
          selectedDay: clamp(Number(raw.selectedDay) || 0, 0, Math.max(0, dayCount - 1)),
          selectedCells: Array.isArray(raw.selectedCells) ? raw.selectedCells : [],
          _meta: raw._meta && typeof raw._meta === "object" ? raw._meta : { updatedAt: 0, clientId: "" },
        };
      };

      const loadLocalState = () => {
        try {
          const r =
            localStorage.getItem(STORAGE_KEY) ||
            localStorage.getItem("omer-mesai-planlayici-single-v5") ||
            localStorage.getItem("omer-mesai-planlayici-single-v4") ||
            localStorage.getItem("omer-mesai-planlayici-single-v3");
          return r ? sanitizeState(JSON.parse(r)) : createInitialState();
        } catch {
          return createInitialState();
        }
      };

      const loadCloudConfig = () => {
        if (DEFAULT_SUPABASE_URL && DEFAULT_SUPABASE_ANON_KEY) {
          return {
            url: DEFAULT_SUPABASE_URL.trim().replace(/\/+$/, ""),
            key: DEFAULT_SUPABASE_ANON_KEY.trim(),
            source: "code",
          };
        }
        try {
          const raw = localStorage.getItem(CLOUD_CFG_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.url && parsed.key) {
              return {
                url: String(parsed.url).trim().replace(/\/+$/, ""),
                key: String(parsed.key).trim(),
                source: "local",
              };
            }
          }
        } catch {}
        return { url: "", key: "", source: "none" };
      };

      const loadServerCloudConfig = async () => {
        if (window.location.protocol !== "http:" && window.location.protocol !== "https:") {
          return null;
        }
        try {
          const res = await fetch("/api/config", { cache: "no-store" });
          if (!res.ok) return null;
          const data = await res.json();
          if (data && data.url && data.anonKey) {
            return {
              url: String(data.url).trim().replace(/\/+$/, ""),
              key: String(data.anonKey).trim(),
              source: "vercel",
            };
          }
        } catch {}
        return null;
      };

      // --- App Runtime ---
      let state = loadLocalState();
      let cloudCfg = loadCloudConfig();
      let sbClient = null;
      let sbChannel = null;
      let cloudStatus = cloudCfg.url && cloudCfg.key ? "loading" : "offline"; // offline | loading | synced | saving | error
      let lastSyncedAt = null;
      let hasHydratedCloud = !(cloudCfg.url && cloudCfg.key);
      let lastSyncedSignature = "";
      let cloudSaveTimer = null;
      let pendingCloudDirty = false;

      let history = [];
      let future = [];
      let viewMode = "weekly"; // weekly | daily
      let showSettings = false;
      let showCloudPanel = false;
      let showBulkAdd = false;
      let showArchive = false;
      let showChangelog = true;
      let showNotes = true;
      let showSpecial = true;
      let showExportMenu = false;
      let boardMode = false;
      let ctxTarget = null;
      let selectedLogIds = [];
      let draggedCell = null;
      let nameInputVal = "";
      let bulkInputVal = "";
      let noteInputVal = "";
      let cloudUrlInput = cloudCfg.url;
      let cloudKeyInput = cloudCfg.key;
      let toastTimer = null;

      const focusTodayInWeek = () => {
        const days = buildDays(state.settings.startDate, state.settings.dayCount);
        const todayIdx = days.findIndex((d) => d.isToday);
        if (todayIdx !== -1) state.selectedDay = todayIdx;
      };
      focusTodayInWeek();

      // --- Cloud Sync Engine (Veri Ezme Korumalı + Anlık Debounce + Canlı Realtime) ---
      const stripVolatile = (st) => {
        const c = clone(st);
        delete c._meta;
        delete c.selectedCells;
        return JSON.stringify(c);
      };

      const updateCloudBadgeOnly = () => {
        const pill = document.getElementById("cloudStatusPill");
        if (!pill) return;
        const map = {
          synced: ["synced", "☁️ Bulut Senkron"],
          saving: ["saving", "⏳ Kaydediliyor..."],
          loading: ["loading", "📥 Yükleniyor..."],
          error: ["error", "⚠️ Bulut Hatası"],
          offline: ["offline", "📴 Yerel Mod"],
        };
        const [cls, label] = map[cloudStatus] || map.offline;
        pill.className = `cloud-pill ${cls}`;
        pill.textContent = label;
      };

      const initSupabaseClient = () => {
        if (sbChannel && sbClient) {
          try { sbClient.removeChannel(sbChannel); } catch {}
          sbChannel = null;
        }
        sbClient = null;
        if (!cloudCfg.url || !cloudCfg.key) {
          cloudStatus = "offline";
          hasHydratedCloud = true;
          updateCloudBadgeOnly();
          return;
        }
        if (window.supabase && typeof window.supabase.createClient === "function") {
          sbClient = window.supabase.createClient(cloudCfg.url, cloudCfg.key, {
            auth: { persistSession: false, autoRefreshToken: false },
          });
        }
      };

      const restHeaders = () => ({
        "Content-Type": "application/json",
        apikey: cloudCfg.key,
        Authorization: `Bearer ${cloudCfg.key}`,
        Prefer: "resolution=merge-duplicates,return=minimal",
      });

      const fetchCloudState = async (isInitial = false) => {
        if (!cloudCfg.url || !cloudCfg.key) {
          cloudStatus = "offline";
          hasHydratedCloud = true;
          updateCloudBadgeOnly();
          return;
        }
        if (isInitial) {
          cloudStatus = "loading";
          updateCloudBadgeOnly();
        }
        try {
          const url = `${cloudCfg.url}/rest/v1/${CLOUD_TABLE_NAME}?id=eq.${CLOUD_STATE_ID}&select=state`;
          const res = await fetch(url, {
            method: "GET",
            headers: {
              apikey: cloudCfg.key,
              Authorization: `Bearer ${cloudCfg.key}`,
            },
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const rows = await res.json();
          const remoteRaw = Array.isArray(rows) && rows.length > 0 ? rows[0].state : null;

          if (remoteRaw && typeof remoteRaw === "object") {
            const remoteSanitized = sanitizeState(remoteRaw);
            const remoteSig = stripVolatile(remoteSanitized);
            const localSig = stripVolatile(state);
            const remoteTs = Number(remoteSanitized._meta?.updatedAt || 0);
            const localTs = Number(state._meta?.updatedAt || 0);

            if (isInitial || (remoteSig !== localSig && remoteTs >= localTs)) {
              state = remoteSanitized;
              lastSyncedSignature = remoteSig;
              try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
              hasHydratedCloud = true;
              cloudStatus = "synced";
              lastSyncedAt = new Date();
              render(true);
              if (!isInitial) showToast("Diğer cihazdaki güncelleme senkronize edildi.", "info");
              return;
            }
          }
          hasHydratedCloud = true;
          if (!remoteRaw && (state.personnel.length > 0 || hasCurrentWeekContent() || state.notes.length > 0)) {
            pendingCloudDirty = true;
            await pushStateToCloud(false);
            return;
          }
          lastSyncedSignature = stripVolatile(state);
          cloudStatus = "synced";
          lastSyncedAt = new Date();
          updateCloudBadgeOnly();
        } catch (err) {
          console.warn("Bulut okuma hatası:", err);
          hasHydratedCloud = true;
          cloudStatus = "error";
          updateCloudBadgeOnly();
        }
      };

      const pushStateToCloud = async (useKeepalive = false) => {
        if (!cloudCfg.url || !cloudCfg.key || !hasHydratedCloud) return false;
        const sig = stripVolatile(state);
        if (sig === lastSyncedSignature && !pendingCloudDirty) {
          cloudStatus = "synced";
          updateCloudBadgeOnly();
          return true;
        }

        cloudStatus = "saving";
        updateCloudBadgeOnly();

        state._meta = { updatedAt: Date.now(), clientId: CLIENT_ID };
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}

        try {
          const url = `${cloudCfg.url}/rest/v1/${CLOUD_TABLE_NAME}?on_conflict=id`;
          const res = await fetch(url, {
            method: "POST",
            headers: restHeaders(),
            body: JSON.stringify([{ id: CLOUD_STATE_ID, state }]),
            keepalive: useKeepalive,
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          lastSyncedSignature = sig;
          pendingCloudDirty = false;
          cloudStatus = "synced";
          lastSyncedAt = new Date();
          updateCloudBadgeOnly();
          return true;
        } catch (err) {
          console.warn("Bulut kayıt hatası:", err);
          cloudStatus = "error";
          updateCloudBadgeOnly();
          return false;
        }
      };

      const scheduleCloudSave = () => {
        if (!cloudCfg.url || !cloudCfg.key || !hasHydratedCloud) return;
        const sig = stripVolatile(state);
        if (sig === lastSyncedSignature) return;
        pendingCloudDirty = true;
        cloudStatus = "saving";
        updateCloudBadgeOnly();
        if (cloudSaveTimer) clearTimeout(cloudSaveTimer);
        cloudSaveTimer = setTimeout(() => {
          void pushStateToCloud(false);
        }, 600);
      };

      const subscribeRealtime = () => {
        if (!sbClient) return;
        if (sbChannel) {
          try { sbClient.removeChannel(sbChannel); } catch {}
        }
        try {
          sbChannel = sbClient
            .channel("mesai-pro-live-sync")
            .on(
              "postgres_changes",
              {
                event: "*",
                schema: "public",
                table: CLOUD_TABLE_NAME,
                filter: `id=eq.${CLOUD_STATE_ID}`,
              },
              (payload) => {
                const incoming = payload?.new?.state;
                if (!incoming || typeof incoming !== "object") return;
                if (incoming._meta?.clientId === CLIENT_ID) return;
                const sanitized = sanitizeState(incoming);
                const sig = stripVolatile(sanitized);
                if (sig === lastSyncedSignature) return;
                state = sanitized;
                lastSyncedSignature = sig;
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
                cloudStatus = "synced";
                lastSyncedAt = new Date();
                render(true);
                showToast("☁️ Canlı güncelleme alındı.", "info");
              }
            )
            .subscribe();
        } catch (err) {
          console.warn("Realtime abonelik hatası:", err);
        }
      };

      const startCloudEngine = async () => {
        if (!cloudCfg.url || !cloudCfg.key) {
          const serverCfg = await loadServerCloudConfig();
          if (serverCfg) {
            cloudCfg = serverCfg;
            cloudUrlInput = serverCfg.url;
            cloudKeyInput = serverCfg.key;
            hasHydratedCloud = false;
            cloudStatus = "loading";
            updateCloudBadgeOnly();
          }
        }
        initSupabaseClient();
        if (cloudCfg.url && cloudCfg.key) {
          await fetchCloudState(true);
          subscribeRealtime();
        }
      };

      // --- Week Archive Helpers ---
      const hasCurrentWeekContent = () => {
        const hasSched = Object.values(state.schedule || {}).some((dayObj) =>
          Object.values(dayObj || {}).some((c) => c && c.type)
        );
        const hasSp = Object.values(state.special || {}).some((c) => c && c.type);
        const hasLogs = (state.changeLogs || []).length > 0;
        return hasSched || hasSp || hasLogs;
      };

      const snapshotCurrentWeek = () => {
        const key = state.settings.startDate;
        if (!key) return;
        state.weeksArchive = state.weeksArchive || {};
        if (hasCurrentWeekContent() || state.weeksArchive[key]) {
          state.weeksArchive[key] = {
            schedule: clone(state.schedule),
            special: clone(state.special),
            offMap: clone(state.offMap),
            changeLogs: clone(state.changeLogs),
            reveal: clone(state.reveal),
            draw: clone(state.draw),
            profile: state.settings.profile,
            updatedAt: new Date().toISOString(),
          };
        }
      };

      const switchToWeek = (targetMondayYmd, silent = false) => {
        const normalized = toYmd(mondayOf(parseYmd(targetMondayYmd)));
        if (normalized === state.settings.startDate) return;
        pushHistory();
        snapshotCurrentWeek();

        const archived = state.weeksArchive?.[normalized];
        state.settings.startDate = normalized;
        if (archived) {
          state.schedule = clone(archived.schedule || {});
          state.special = clone(archived.special || {});
          state.offMap = clone(archived.offMap || {});
          state.changeLogs = clone(archived.changeLogs || []);
          state.reveal = clone(archived.reveal || []);
          state.draw = clone(archived.draw || []);
        } else {
          state.schedule = {};
          state.special = {};
          state.offMap = {};
          state.changeLogs = [];
          state.reveal = [];
          state.draw = [];
        }
        state.selectedCells = [];
        state.selectedDay = 0;
        focusTodayInWeek();
        if (!silent) {
          const wk = isoWeek(parseYmd(normalized));
          showToast(
            archived ? `${wk}. Hafta arşivden yüklendi.` : `${wk}. Haftaya geçildi.`,
            "info"
          );
        }
        render();
      };

      const saveLocal = (skipCloud = false) => {
        snapshotCurrentWeek();
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
        if (!skipCloud) scheduleCloudSave();
      };

      const showToast = (text, type = "info") => {
        const el = document.getElementById("toast");
        if (!el) return;
        el.textContent = text;
        el.className = `toast ${type} no-print`;
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.add("hidden"), 2500);
      };

      const hideContextMenu = () => {
        ctxTarget = null;
        const menu = document.getElementById("ctxMenu");
        if (menu) menu.classList.add("hidden");
      };

      // --- Apply Cell Type Helper ---
      const applyTypeToCells = (cells, type) => {
        if (!cells.length) return;
        let saleText = null;
        if (type === "sale") {
          saleText = saleTextFromManualName();
          if (saleText === null) return;
        }
        pushHistory();
        cells.forEach((sel) => {
          let nc;
          if (type === "") nc = emptyCell();
          else if (type === "off") nc = createCell("off", "MUAF");
          else if (type === "vacation") nc = createCell("vacation", "YILLIK İZİN");
          else if (type === "sick") nc = createCell("sick", "RAPORLU");
          else if (type === "sale") nc = createCell("sale", saleText || "SATIŞ");
          else nc = shiftCell(type, state.settings);

          if (sel.special) state.special[sel.dayIndex] = nc;
          else {
            state.schedule[sel.dayIndex] = state.schedule[sel.dayIndex] || {};
            state.schedule[sel.dayIndex][sel.name] = nc;
            state.offMap[sel.dayIndex] = state.offMap[sel.dayIndex] || {};
            if (type === "off" || type === "vacation" || type === "sick") state.offMap[sel.dayIndex][sel.name] = type;
            else delete state.offMap[sel.dayIndex][sel.name];
          }
        });
        render();
      };

      const editSingleCell = (sel) => {
        const cur = sel.special
          ? (state.special[sel.dayIndex] || emptyCell())
          : (state.schedule[sel.dayIndex]?.[sel.name] || emptyCell());
        const r = window.prompt("Hücre metni (SATIŞ yazarsanız manuel isim sorulur)", cur.text);
        if (r === null) return;
        const t = r.trim().toLocaleUpperCase("tr-TR");
        let nc;
        if (!t) nc = emptyCell();
        else if (t === "SATIŞ" || t.startsWith("SATIŞ:")) {
          const st = saleTextFromManualName();
          if (st === null) return;
          nc = createCell("sale", st);
        } else nc = createCell("custom", t);

        pushHistory();
        if (sel.special) state.special[sel.dayIndex] = nc;
        else {
          state.schedule[sel.dayIndex] = state.schedule[sel.dayIndex] || {};
          state.schedule[sel.dayIndex][sel.name] = nc;
        }
        state.selectedCells = [];
        render();
      };

      const toggleCompleteCells = (cells) => {
        if (!cells.length) return;
        pushHistory();
        cells.forEach((sel) => {
          if (sel.special) {
            const c = state.special[sel.dayIndex] || emptyCell();
            state.special[sel.dayIndex] = { ...c, completed: !c.completed };
          } else {
            state.schedule[sel.dayIndex] = state.schedule[sel.dayIndex] || {};
            const c = state.schedule[sel.dayIndex][sel.name] || emptyCell();
            state.schedule[sel.dayIndex][sel.name] = { ...c, completed: !c.completed };
          }
        });
        render();
      };

      const openContextMenu = (e, sel, dayLabel) => {
        e.preventDefault();
        e.stopPropagation();
        ctxTarget = sel;
        const menu = document.getElementById("ctxMenu");
        if (!menu) return;

        const isSabah = state.settings.profile === "sabah";
        menu.innerHTML = `
          <div class="ctx-hdr">${esc(sel.name)} • ${esc(dayLabel)}</div>
          ${(!sel.special || !isSabah) ? `
            <button class="ctx-item" data-ctx="early"><span class="ctx-dot" style="background:#3b82f6;"></span>Erken Giriş</button>
          ` : ""}
          <button class="ctx-item" data-ctx="late"><span class="ctx-dot" style="background:#ef4444;"></span>Geç Çıkış</button>
          <button class="ctx-item" data-ctx="sale"><span class="ctx-dot" style="background:#f59e0b;"></span>Satış</button>
          ${!sel.special ? `
            <div class="ctx-sep"></div>
            <button class="ctx-item" data-ctx="off"><span class="ctx-dot" style="background:#94a3b8;"></span>Muaf</button>
            <button class="ctx-item" data-ctx="vacation"><span class="ctx-dot" style="background:#0284c7;"></span>Yıllık İzin</button>
            <button class="ctx-item" data-ctx="sick"><span class="ctx-dot" style="background:#e11d48;"></span>Raporlu</button>
          ` : ""}
          <div class="ctx-sep"></div>
          <button class="ctx-item" data-ctx="edit">✏️ Metni Düzenle</button>
          <button class="ctx-item" data-ctx="complete">✓ Üstünü Çiz / Kaldır</button>
          <button class="ctx-item" data-ctx="clear" style="color:#e11d48;">🗑 Hücreyi Temizle</button>
        `;

        menu.classList.remove("hidden");
        const rect = menu.getBoundingClientRect();
        const x = Math.min(e.clientX, window.innerWidth - rect.width - 10);
        const y = Math.min(e.clientY, window.innerHeight - rect.height - 10);
        menu.style.left = `${Math.max(8, x)}px`;
        menu.style.top = `${Math.max(8, y)}px`;

        menu.onclick = (ev) => {
          const btn = ev.target.closest("[data-ctx]");
          if (!btn || !ctxTarget) return;
          const act = btn.dataset.ctx;
          const target = ctxTarget;
          hideContextMenu();
          if (act === "edit") editSingleCell(target);
          else if (act === "complete") toggleCompleteCells([target]);
          else if (act === "clear") applyTypeToCells([target], "");
          else applyTypeToCells([target], act);
        };
      };

      const formatAllTeamMessage = (days, weekInfo) => {
        let msg = `📅 *${weekInfo}*\n\n`;
        state.personnel.forEach((name) => {
          const sh = days.map((d) => {
            const c = state.schedule[d.index]?.[name];
            if (!c || !c.type || c.type === "sale") return null;
            if (c.type === "off") return `${d.shortLabel}: MUAF`;
            if (c.type === "vacation") return `${d.shortLabel}: İZİN`;
            if (c.type === "sick") return `${d.shortLabel}: RAPOR`;
            return `${d.shortLabel}: ${c.type === "early" ? "☀️ Erken" : "🌙 Geç"}`;
          }).filter(Boolean);
          if (sh.length) msg += `👤 *${name}*\n${sh.join(" | ")}\n\n`;
        });
        const sp = days.map((d) => {
          const c = state.special[d.index];
          if (!c || !c.type || c.type === "sale") return null;
          return `${d.shortLabel}: ${c.type === "early" ? "☀️ Erken" : "🌙 Geç"}`;
        }).filter(Boolean);
        if (sp.length) msg += `⚙️ *YEDEK PARÇA (${SPECIAL_PERSON})*\n${sp.join(" | ")}\n\n`;
        return msg.trim();
      };

      const pushHistory = () => {
        history.push(clone(state));
        if (history.length > 20) history.shift();
        future = [];
      };

      const generateSmartDay = (day, pointer) => {
        const cells = {};
        const used = new Set();
        const total = state.personnel.length;
        state.personnel.forEach((name) => {
          const st = state.offMap[day.index]?.[name];
          if (st) {
            const text = st === "vacation" ? "YILLIK İZİN" : st === "sick" ? "RAPORLU" : "MUAF";
            cells[name] = createCell(st, text);
            used.add(name);
          } else {
            cells[name] = emptyCell();
          }
        });
        if (!total) return { cells, nextPointer: 0 };

        const s = state.settings;
        let order;
        if (s.profile === "sabah") order = ["late"];
        else if (s.profile === "gece") {
          order = day.isSaturday
            ? (s.saturdayLateEnabled ? ["early", "late"] : ["late"])
            : (day.index % 2 === 0 ? ["late", "early"] : ["early", "late"]);
        } else {
          order = ["early", "late"];
        }

        const avail = Math.max(0, total - used.size);
        const earlyCount = s.profile === "sabah" ? 0 : Math.max(0, Math.min(s.earlyPerDay, avail));
        const effEarly = day.isSaturday && s.profile === "gece" && !s.saturdayLateEnabled ? 0 : earlyCount;
        const lateCount = day.isSaturday && s.profile === "oglen" && !s.saturdayLateEnabled ? 0 : Math.max(0, Math.min(s.latePerDay, avail));

        let ptr = pointer % total;
        for (const kind of order) {
          const count = kind === "early" ? effEarly : lateCount;
          for (let i = 0; i < count; i++) {
            let attempts = 0;
            while (used.has(state.personnel[ptr]) && attempts < total) {
              ptr = (ptr + 1) % total;
              attempts++;
            }
            if (!used.has(state.personnel[ptr])) {
              cells[state.personnel[ptr]] = shiftCell(kind, s);
              used.add(state.personnel[ptr]);
              ptr = (ptr + 1) % total;
            }
          }
        }
        return { cells, nextPointer: ptr };
      };

      const addLog = (text, dayIndex, days, kind = "swap") => {
        const suffix = dayIndex !== null && days[dayIndex] ? ` (${days[dayIndex].label})` : "";
        state.changeLogs.unshift({
          id: `${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          text: text + suffix,
          kind,
          dayIndex,
          createdAt: new Date().toISOString(),
        });
        if (state.changeLogs.length > 200) state.changeLogs.length = 200;
        showChangelog = true;
      };

      const visibleCell = (dayIndex, cell) => {
        if (viewMode !== "daily") return cell;
        const stage = state.reveal[dayIndex] ?? 0;
        if (stage >= 2) return cell;
        if (stage <= 0) return emptyCell();
        const first = state.settings.startShift === "late" ? "late" : "early";
        return cell.type === first || cell.type === "sale" ? cell : emptyCell();
      };

      // --- Pure Canvas Offline PNG Export ---
      const exportPng = (scale, includeSpecial) => {
        const days = buildDays(state.settings.startDate, state.settings.dayCount);
        const colW = 175;
        const personW = 220;
        const headerH = 58;
        const rowH = 68;
        const padX = 24;
        const padY = 24;
        const gapBetween = 18;

        const mainRows = Math.max(1, state.personnel.length);
        const mainTableH = headerH + mainRows * rowH;

        const includeLogs = showChangelog && state.changeLogs.length > 0;
        const logRowH = 34;
        const logsH = includeLogs ? 42 + state.changeLogs.length * logRowH + 14 : 0;

        const spTableH = includeSpecial ? 42 + headerH + rowH : 0;

        const totalW = padX * 2 + personW + days.length * colW;
        let totalH = padY * 2 + mainTableH;
        if (includeLogs) totalH += gapBetween + logsH;
        if (includeSpecial) totalH += gapBetween + spTableH;

        const canvas = document.createElement("canvas");
        canvas.width = totalW * scale;
        canvas.height = totalH * scale;
        const ctx = canvas.getContext("2d");
        ctx.scale(scale, scale);

        ctx.fillStyle = "#eaedf2";
        ctx.fillRect(0, 0, totalW, totalH);

        const tblW = personW + days.length * colW;

        const drawTable = (startY, isSpecial) => {
          const list = isSpecial ? [SPECIAL_PERSON] : state.personnel;
          let y = startY;

          if (isSpecial) {
            ctx.fillStyle = "#fffbeb";
            ctx.fillRect(padX, y, tblW, 42);
            ctx.strokeStyle = "#e2e8f0";
            ctx.strokeRect(padX, y, tblW, 42);
            ctx.fillStyle = "#64748b";
            ctx.font = "bold 12px Inter, sans-serif";
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            ctx.fillText("⚙️  YEDEK PARÇA", padX + 16, y + 21);
            y += 42;
          }

          ctx.fillStyle = isSpecial ? "#fffbeb" : "#f1f3f7";
          ctx.fillRect(padX, y, tblW, headerH);
          ctx.strokeStyle = "#e2e8f0";
          ctx.strokeRect(padX, y, tblW, headerH);

          ctx.fillStyle = isSpecial ? "#b45309" : "#64748b";
          ctx.font = "bold 12px Inter, sans-serif";
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillText("PERSONEL", padX + 16, y + headerH / 2);

          days.forEach((d, di) => {
            const x = padX + personW + di * colW;
            ctx.strokeStyle = "#e2e8f0";
            ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + headerH); ctx.stroke();
            ctx.fillStyle = "#334155";
            ctx.font = "bold 14px Inter, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(d.label, x + colW / 2, y + 22);
            ctx.fillStyle = "#94a3b8";
            ctx.font = "500 11px Inter, sans-serif";
            ctx.fillText(d.fullDate, x + colW / 2, y + 40);
          });
          y += headerH;

          list.forEach((pname, ri) => {
            const rowBg = isSpecial ? "#fffbeb" : (ri % 2 === 0 ? "#b8c0cc" : "#ffffff");
            ctx.fillStyle = rowBg;
            ctx.fillRect(padX, y, tblW, rowH);
            ctx.strokeStyle = "#e2e8f0";
            ctx.strokeRect(padX, y, tblW, rowH);

            ctx.fillStyle = isSpecial ? "#78350f" : "#1e293b";
            ctx.font = "bold 13px Inter, sans-serif";
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            ctx.fillText(pname, padX + 16, y + rowH / 2);

            days.forEach((d, di) => {
              const x = padX + personW + di * colW;
              ctx.strokeStyle = "#e2e8f0";
              ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + rowH); ctx.stroke();

              const raw = isSpecial ? (state.special[d.index] || emptyCell()) : (state.schedule[d.index]?.[pname] || emptyCell());
              const cell = visibleCell(d.index, raw);
              const bx = x + 6, by = y + 6, bw = colW - 12, bh = rowH - 12;

              let bg = "#f8f9fb", fg = "transparent";
              if (cell.completed) { bg = "#e2e8f0"; fg = "#94a3b8"; }
              else if (cell.type === "early") { bg = "#d4e6f9"; fg = "#1a4b8c"; }
              else if (cell.type === "late") { bg = "#f7d7d4"; fg = "#a83029"; }
              else if (cell.type === "sale") { bg = "#fef3c7"; fg = "#92400e"; }
              else if (cell.type === "vacation") { bg = "#e0f2fe"; fg = "#0369a1"; }
              else if (cell.type === "sick") { bg = "#ffe4e6"; fg = "#be123c"; }
              else if (cell.type === "off") { bg = "#e2e8f0"; fg = "#64748b"; }
              else if (cell.type === "custom") { bg = "#ede9fe"; fg = "#5b21b6"; }
              else if (isSpecial) { bg = "#ffffff"; fg = "#fcd34d"; }

              ctx.fillStyle = bg;
              ctx.beginPath();
              ctx.roundRect(bx, by, bw, bh, 8);
              ctx.fill();

              if (cell.text) {
                ctx.fillStyle = fg;
                ctx.font = "bold 13px Inter, sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(cell.text, bx + bw / 2, by + bh / 2);
              }
            });
            y += rowH;
          });
          return y;
        };

        let curY = drawTable(padY, false);

        if (includeLogs) {
          curY += gapBetween;
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(padX, curY, tblW, logsH);
          ctx.strokeStyle = "#d946ef";
          ctx.lineWidth = 2;
          ctx.strokeRect(padX, curY, tblW, logsH);
          ctx.lineWidth = 1;

          ctx.fillStyle = "#c026d3";
          ctx.fillRect(padX, curY, 6, logsH);

          ctx.fillStyle = "#fdf4ff";
          ctx.fillRect(padX + 6, curY + 1, tblW - 7, 40);
          ctx.fillStyle = "#86198f";
          ctx.font = "bold 13px Inter, sans-serif";
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillText(`⇄  TAKAS AÇIKLAMALARI (${state.changeLogs.length})`, padX + 20, curY + 21);

          let ly = curY + 48;
          state.changeLogs.forEach((l) => {
            const isRep = l.kind === "replace" || String(l.text).includes("→");
            ctx.fillStyle = isRep ? "#fff7ed" : "#fdf4ff";
            ctx.beginPath();
            ctx.roundRect(padX + 18, ly, tblW - 36, logRowH - 6, 7);
            ctx.fill();

            ctx.fillStyle = isRep ? "#f97316" : "#c026d3";
            ctx.beginPath();
            ctx.roundRect(padX + 24, ly + 5, 58, 18, 4);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 10px Inter, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(isRep ? "YERİNE" : "TAKAS", padX + 53, ly + 14);

            ctx.fillStyle = isRep ? "#7c2d12" : "#4a044e";
            ctx.font = "bold 12px Inter, sans-serif";
